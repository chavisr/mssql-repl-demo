# VM 1: publisher + distributor. Run this file independently on the publisher VM.
services:
  sql-publisher:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-publisher
    hostname: sql-publisher
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P@ssw0rd_Pub1"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
    # Prepare local snapshot storage, then run SQL Server as mssql.
    command: >
      bash -c "
      mkdir -p /var/opt/mssql/ReplData &&
      chown -R mssql:mssql /var/opt/mssql/ReplData &&
      exec su mssql -c '/opt/mssql/bin/sqlservr'
      "
    # SQL Server listens directly on VM 1 TCP 1433.
    network_mode: host
    # Agents connect to the local distributor by server name, not localhost.
    # Map both spellings emitted by SQL Server; keep the remote subscriber route.
    extra_hosts:
      sql-publisher: "127.0.0.1"
      SQL-PUBLISHER: "127.0.0.1"
      sql-subscriber: "${SUBSCRIBER_VM_IP:?Set SUBSCRIBER_VM_IP to the reachable subscriber VM IP address}"
